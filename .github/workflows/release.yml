name: Release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          version=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          tag="v${version}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping release"
          else
            echo "new_version=$version" >> "$GITHUB_OUTPUT"
            echo "New version detected: $version"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.new_version != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Smoke test (wheel)
        run: >
          uv run --isolated --no-project --with dist/*.whl --
          python -c "from sqla_authz import authorize_query, __version__; print(__version__)"
      - name: Smoke test (sdist)
        run: >
          uv run --isolated --no-project --with dist/*.tar.gz --
          python -c "from sqla_authz import authorize_query, __version__; print(__version__)"
      - run: uv publish
      - name: Create tag
        run: |
          git tag "v${{ needs.check-version.outputs.new_version }}"
          git push origin "v${{ needs.check-version.outputs.new_version }}"

  github-release:
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.check-version.outputs.new_version, 'b') || contains(needs.check-version.outputs.new_version, 'a') || contains(needs.check-version.outputs.new_version, 'rc') }}
